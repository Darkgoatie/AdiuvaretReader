name: AdiuvaretReader
options:
  bundleIdPrefix: com.halit
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  ReaderPackages:
    path: Packages
targets:
  AdiuvaretReader:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: ReaderPackages
        product: ReaderDesign
      - package: ReaderPackages
        product: ReaderStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halit.adiuvaretreader
        DEVELOPMENT_TEAM: P6LL282795
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Adiuvaret Reader
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
